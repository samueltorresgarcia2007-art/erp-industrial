<head>

:root{
--azul:#0756a3;
--azul-escuro:#063b70;
--azul-claro:#eaf3ff;
--vermelho:#d71920;
--verde:#159447;
--amarelo:#e6a700;
--branco:#fff;
--cinza:#f4f6f8;
--cinza2:#dfe4e8;
--texto:#17202a;
--sombra:0 8px 25px rgba(0,0,0,.10);
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:var(--cinza);
color:var(--texto);
}

.campo{
margin-bottom:16px;
text-align:left;
}

.campo label{
display:block;
font-weight:bold;
margin-bottom:7px;
color:#333;
}

.campo input,
.campo select{
width:100%;
padding:13px;
border:1px solid #ccd3da;
border-radius:9px;
outline:none;
font-size:15px;
background:white;
}

.campo input:focus,
.campo select:focus{
border-color:var(--azul);
box-shadow:0 0 0 3px rgba(7,86,163,.12);
}

.btn{
border:none;
padding:12px 18px;
border-radius:9px;
cursor:pointer;
font-weight:bold;
transition:.2s;
}

.btn:hover{
transform:translateY(-1px);
}

.btn-primary{
background:var(--azul);
color:white;
}

.btn-danger{
background:var(--vermelho);
color:white;
}

.btn-success{
background:var(--verde);
color:white;
}

.btn-secondary{
background:#e8edf1;
color:#263238;
}
